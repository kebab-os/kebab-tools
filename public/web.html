<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>kebab-tools | Web Client</title>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --sub: #737373;
      --acc: #000000;
      --border: #e5e5e5;
      --panel: #f9f9fb;
      --font: "Inter", -apple-system, system-ui, sans-serif;
      --mono: "JetBrains Mono", "SF Mono", "Menlo", monospace;
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --fg: #f5f5f5;
      --sub: #a3a3a3;
      --acc: #ffffff;
      --border: #262626;
      --panel: #171717;
    }

    * { box-sizing: border-box; transition: background 0.2s, color 0.2s; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Minimal Header */
    header {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
    .nav-actions { display: flex; gap: 12px; }
    button.icon-btn {
      background: none;
      border: none;
      color: var(--sub);
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
    }
    button.icon-btn:hover { color: var(--fg); background: var(--panel); }

    /* Terminal Output */
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.6;
      scroll-behavior: smooth;
    }
    .line { margin-bottom: 4px; white-space: pre-wrap; }
    .line.prompt-line { color: var(--sub); margin-top: 1.5rem; display: flex; gap: 10px; }
    .line.prompt-line i { width: 14px; margin-top: 4px; }
    .line.response { color: var(--fg); padding-left: 24px; }
    .line.error { color: #ef4444; }

    /* Floating Input Bar */
    .input-wrapper {
      padding: 1.5rem 2rem 2rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .input-container {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px 12px;
      gap: 12px;
    }
    #cmd-input {
      flex: 1;
      background: none;
      border: none;
      color: var(--fg);
      font-family: var(--mono);
      font-size: 15px;
      padding: 12px 0;
      outline: none;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--bg);
      border: 1px solid var(--border);
      width: 90%;
      max-width: 400px;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 1rem; }
    .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }

    /* Hide scrollbar */
    #output::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i data-lucide="terminal"></i> kebab-tools</div>
    <div class="nav-actions">
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">
        <i data-lucide="sun" id="theme-icon"></i>
      </button>
      <button class="icon-btn" onclick="toggleModal()" title="Settings">
        <i data-lucide="settings"></i>
      </button>
    </div>
  </header>

  <main id="output"></main>

  <div class="input-wrapper">
    <div class="input-container">
      <i data-lucide="chevron-right" size="18" style="color: var(--sub)"></i>
      <input type="text" id="cmd-input" placeholder="Enter command..." autofocus spellcheck="false" autocomplete="off">
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal" onclick="if(event.target === this) toggleModal()">
    <div class="modal">
      <div class="modal-header">
        <h3 style="margin:0">Settings</h3>
        <button class="icon-btn" onclick="toggleModal()"><i data-lucide="x"></i></button>
      </div>
      <div class="setting-item">
        <span>Clear History</span>
        <button class="icon-btn" onclick="clearLocalHistory()"><i data-lucide="trash-2"></i></button>
      </div>
      <div class="setting-item">
        <span>About</span>
        <span style="font-size: 12px; color: var(--sub)">v1.0 Web Shell</span>
      </div>
    </div>
  </div>

  <script>
    const output = document.getElementById('output');
    const input = document.getElementById('cmd-input');
    const PROXY = "/shell-proxy";
    
    // History memory
    let history = JSON.parse(localStorage.getItem('kebab_hist') || '[]');
    let histPos = history.length;

    function printLine(text, type = 'response') {
      const div = document.createElement('div');
      div.className = `line ${type}`;
      if (type === 'prompt-line') {
        div.innerHTML = `<i data-lucide="terminal"></i> <span>${text}</span>`;
      } else {
        div.textContent = text;
      }
      output.appendChild(div);
      output.scrollTop = output.scrollHeight;
      lucide.createIcons();
    }

    async function exec(cmd) {
      if (!cmd.trim()) return;
      
      printLine(cmd, 'prompt-line');
      
      // Memory management
      if (history[history.length - 1] !== cmd) {
        history.push(cmd);
        localStorage.setItem('kebab_hist', JSON.stringify(history));
      }
      histPos = history.length;

      // Logic from your Python script: space -> /
      const path = cmd.replace(/ /g, "/");

      try {
        const res = await fetch(`${PROXY}?path=${encodeURIComponent(path)}`);
        const data = await res.text();
        printLine(data.trimEnd());
      } catch (err) {
        printLine(`Error: ${err.message}`, 'error');
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = input.value;
        input.value = '';
        exec(val);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (histPos > 0) {
          histPos--;
          input.value = history[histPos];
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histPos < history.length - 1) {
          histPos++;
          input.value = history[histPos];
        } else {
          histPos = history.length;
          input.value = '';
        }
      }
    });

    // Theme Toggle
    function toggleTheme() {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      const icon = document.getElementById('theme-icon');
      icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      lucide.createIcons();
    }

    // Modal
    function toggleModal() {
      const m = document.getElementById('settings-modal');
      m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }

    function clearLocalHistory() {
      history = [];
      localStorage.removeItem('kebab_hist');
      toggleModal();
      alert('History cleared');
    }

    // Init banner (Python logic)
    (async () => {
      lucide.createIcons();
      try {
        const res = await fetch(`${PROXY}?path=version`);
        const ver = await res.text();
        printLine(`kebab-tools ${ver.trim()} | Shell`, 'prompt-line');
        printLine("Type 'help' for available tools.");
      } catch {
        printLine("Offline Mode: Server unreachable.", "error");
      }
    })();
  </script>
</body>
</html>
