<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>kebab-tools</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #171717;
      --sub: #9ca3af;
      --border: #f3f4f6;
      --panel: #f9fafb;
      --accent: #000000;
      --font: "Inter", -apple-system, system-ui, sans-serif;
      --mono: "JetBrains Mono", "SF Mono", monospace;
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --fg: #e5e5e5;
      --sub: #404040;
      --border: #1a1a1a;
      --panel: #111111;
      --accent: #ffffff;
    }

    * { box-sizing: border-box; transition: background 0.1s, color 0.1s; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    nav {
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .brand { font-size: 13px; font-weight: 500; color: var(--sub); }
    .brand span { color: var(--fg); font-weight: 600; }
    .actions { display: flex; gap: 8px; }

    button.icon-btn {
      background: none;
      border: none;
      color: var(--sub);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
    }
    button.icon-btn:hover { color: var(--accent); background: var(--panel); }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.5;
    }
    .entry { margin-bottom: 1.25rem; }
    
    .cmd-line { 
      display: flex; 
      gap: 6px; 
      color: var(--sub); 
      font-size: 10px; 
      margin-bottom: 2px;
      text-transform: lowercase;
      letter-spacing: 0.02em;
    }

    .response-text { 
      color: var(--fg); 
      white-space: pre-wrap; 
    }
    .error { color: #f87171 !important; }

    .input-area {
      padding: 1rem 1.5rem 1.5rem;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }
    .field {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      gap: 10px;
    }
    .field span { color: var(--sub); font-family: var(--mono); font-size: 12px; }
    #cmd-input {
      flex: 1;
      background: none;
      border: none;
      color: var(--fg);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 0;
      outline: none;
    }

    .modal-wrap {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--bg);
      border: 1px solid var(--border);
      width: 320px;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 20px 25px rgba(0,0,0,0.2);
    }
    .modal h4 { margin: 0 0 1.25rem; font-size: 11px; color: var(--sub); text-transform: uppercase; letter-spacing: 0.1em; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 13px; }
    .row:not(:last-child) { border-bottom: 1px solid var(--border); }
    
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border);
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 12px; width: 12px;
      left: 3px; bottom: 3px;
      background-color: var(--sub);
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(14px); background-color: var(--bg); }

    #output::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body data-theme="dark">

  <nav>
    <div class="brand"><span>kebab</span> tools</div>
    <div class="actions">
      <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">
        <i data-lucide="sun" id="t-icon" size="15"></i>
      </button>
      <button class="icon-btn" onclick="toggleModal()"><i data-lucide="settings" size="15"></i></button>
    </div>
  </nav>

  <main id="output"></main>

  <div class="input-area">
    <div class="field">
      <span>&gt;</span>
      <input type="text" id="cmd-input" placeholder="cmd..." autofocus autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="modal-wrap" id="modal" onclick="if(event.target===this) toggleModal()">
    <div class="modal">
      <h4>Preferences</h4>
      
      <div class="row">
        <span>Single Response Mode</span>
        <label class="switch">
          <input type="checkbox" id="mode-toggle" onchange="updatePref('singleMode', this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <div class="row">
        <span>Auto-Focus Input</span>
        <label class="switch">
          <input type="checkbox" id="focus-toggle" onchange="updatePref('autoFocus', this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <div class="row">
        <span>Monospace Font</span>
        <label class="switch">
          <input type="checkbox" id="font-toggle" onchange="updatePref('monoFont', this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <div class="row" style="margin-top:10px">
        <span style="color:var(--sub)">Storage</span>
        <button class="icon-btn" onclick="clearHist()" title="Clear History"><i data-lucide="trash-2" size="14"></i></button>
      </div>

      <div class="row">
        <span style="color:var(--sub)">Version</span>
        <span id="v-label" style="color:var(--sub); font-family:var(--mono); font-size:11px">...</span>
      </div>
    </div>
  </div>

  <script>
    const output = document.getElementById('output');
    const input = document.getElementById('cmd-input');
    const PROXY = "/shell-proxy";
    
    // Default Settings
    let settings = JSON.parse(localStorage.getItem('kb_settings')) || {
      singleMode: false,
      autoFocus: true,
      monoFont: true,
      theme: 'dark'
    };

    let history = JSON.parse(localStorage.getItem('kb_h') || '[]');
    let hIdx = history.length;

    function applySettings() {
      // Apply Preferences to UI
      document.getElementById('mode-toggle').checked = settings.singleMode;
      document.getElementById('focus-toggle').checked = settings.autoFocus;
      document.getElementById('font-toggle').checked = settings.monoFont;
      output.style.fontFamily = settings.monoFont ? 'var(--mono)' : 'var(--font)';
      
      // Apply Theme
      document.body.setAttribute('data-theme', settings.theme);
      const tIcon = document.getElementById('t-icon');
      if (tIcon) {
        tIcon.setAttribute('data-lucide', settings.theme === 'dark' ? 'sun' : 'moon');
        lucide.createIcons();
      }
    }

    function updatePref(key, val) {
      settings[key] = val;
      localStorage.setItem('kb_settings', JSON.stringify(settings));
      applySettings();
    }

    function toggleTheme() {
      const newTheme = settings.theme === 'dark' ? 'light' : 'dark';
      updatePref('theme', newTheme);
    }

    function addEntry(cmd, response, isError = false) {
      if (settings.singleMode) output.innerHTML = '';

      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.innerHTML = `
        <div class="cmd-line"><span class="prompt">&gt;</span><span class="text">${cmd}</span></div>
        <div class="response-text ${isError ? 'error' : ''}">${response}</div>
      `;
      output.appendChild(entry);
      output.scrollTop = output.scrollHeight;
    }

    async function run(cmd) {
      if (!cmd.trim()) return;
      if (history[history.length - 1] !== cmd) {
        history.push(cmd);
        localStorage.setItem('kb_h', JSON.stringify(history));
      }
      hIdx = history.length;
      const path = cmd.replace(/ /g, "/");
      try {
        const res = await fetch(`${PROXY}?path=${encodeURIComponent(path)}`);
        const data = await res.text();
        addEntry(cmd, data.trimEnd());
      } catch (err) {
        addEntry(cmd, `Error: ${err.message}`, true);
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = input.value;
        input.value = '';
        run(val);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (hIdx > 0) { hIdx--; input.value = history[hIdx]; }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (hIdx < history.length - 1) { hIdx++; input.value = history[hIdx]; } 
        else { hIdx = history.length; input.value = ''; }
      }
    });

    function toggleModal() {
      const m = document.getElementById('modal');
      m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }

    function clearHist() {
      if(confirm('Clear history?')) {
        history = [];
        localStorage.removeItem('kb_h');
        hIdx = 0;
      }
    }

    document.addEventListener('click', () => {
      if (settings.autoFocus && document.getElementById('modal').style.display !== 'flex') {
        input.focus();
      }
    });

    (async () => {
      applySettings();
      lucide.createIcons();
      try {
        const r = await fetch(`${PROXY}?path=version`);
        const v = await r.text();
        const ver = v.trim();
        document.getElementById('v-label').textContent = ver;
        addEntry('version', `kebab-tools ${ver}`);
      } catch {
        addEntry('system', 'Connection failed.', true);
      }
    })();
  </script>
</body>
</html>
