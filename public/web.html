<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>kebab-tools | Web Shell</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #171717;
      --sub: #9ca3af;
      --border: #f3f4f6;
      --panel: #f9fafb;
      --accent: #000000;
      --font: "Inter", -apple-system, system-ui, sans-serif;
      --mono: "JetBrains Mono", "SF Mono", monospace;
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --fg: #e5e5e5;
      --sub: #525252;
      --border: #1a1a1a;
      --panel: #111111;
      --accent: #ffffff;
    }

    * { box-sizing: border-box; transition: background 0.15s, color 0.15s; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .brand { font-size: 13px; font-weight: 500; color: var(--sub); }
    .brand span { color: var(--fg); font-weight: 600; }
    .actions { display: flex; gap: 8px; }

    button.icon-btn {
      background: none;
      border: none;
      color: var(--sub);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
    }
    button.icon-btn:hover { color: var(--accent); background: var(--panel); }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.5;
    }
    .entry { margin-bottom: 1.25rem; }
    
    /* Command Line: Smaller and lighter gray */
    .cmd-line { 
      display: flex; 
      gap: 6px; 
      color: var(--sub); 
      font-size: 11px; 
      margin-bottom: 2px;
      text-transform: lowercase;
    }
    .cmd-line .prompt { opacity: 0.7; }

    /* Response: Normal size and color */
    .response-text { 
      color: var(--fg); 
      white-space: pre-wrap; 
      opacity: 1;
    }
    .error { color: #f87171 !important; }

    .input-area {
      padding: 1rem 1.5rem 1.5rem;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }
    .field {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      gap: 10px;
    }
    .field span { color: var(--sub); font-family: var(--mono); font-size: 12px; }
    #cmd-input {
      flex: 1;
      background: none;
      border: none;
      color: var(--fg);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 0;
      outline: none;
    }

    .modal-wrap {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--bg);
      border: 1px solid var(--border);
      width: 260px;
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal h4 { margin: 0 0 1rem; font-size: 12px; color: var(--sub); text-transform: uppercase; letter-spacing: 0.05em; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 13px; }
    .row:not(:last-child) { border-bottom: 1px solid var(--border); }

    #output::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body data-theme="dark">

  <nav>
    <div class="brand"><span>kebab</span> tools</div>
    <div class="actions">
      <button class="icon-btn" onclick="toggleTheme()"><i data-lucide="sun" id="t-icon" size="15"></i></button>
      <button class="icon-btn" onclick="toggleModal()"><i data-lucide="settings" size="15"></i></button>
    </div>
  </nav>

  <main id="output"></main>

  <div class="input-area">
    <div class="field">
      <span>&gt;</span>
      <input type="text" id="cmd-input" placeholder="cmd..." autofocus autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="modal-wrap" id="modal" onclick="if(event.target===this) toggleModal()">
    <div class="modal">
      <h4>Settings</h4>
      <div class="row">
        <span>History</span>
        <button class="icon-btn" onclick="clearHist()"><i data-lucide="trash-2" size="14"></i></button>
      </div>
      <div class="row">
        <span>Version</span>
        <span id="v-label" style="color:var(--sub)">...</span>
      </div>
    </div>
  </div>

  <script>
    const output = document.getElementById('output');
    const input = document.getElementById('cmd-input');
    const PROXY = "/shell-proxy";
    
    let history = JSON.parse(localStorage.getItem('kb_h') || '[]');
    let hIdx = history.length;

    function addEntry(cmd, response, isError = false) {
      const entry = document.createElement('div');
      entry.className = 'entry';
      
      entry.innerHTML = `
        <div class="cmd-line"><span class="prompt">&gt;</span><span class="text">${cmd}</span></div>
        <div class="response-text ${isError ? 'error' : ''}">${response}</div>
      `;
      
      output.appendChild(entry);
      output.scrollTop = output.scrollHeight;
    }

    async function run(cmd) {
      if (!cmd.trim()) return;
      
      if (history[history.length - 1] !== cmd) {
        history.push(cmd);
        localStorage.setItem('kb_h', JSON.stringify(history));
      }
      hIdx = history.length;

      const path = cmd.replace(/ /g, "/");

      try {
        const res = await fetch(`${PROXY}?path=${encodeURIComponent(path)}`);
        const data = await res.text();
        addEntry(cmd, data.trimEnd());
      } catch (err) {
        addEntry(cmd, `Error: ${err.message}`, true);
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = input.value;
        input.value = '';
        run(val);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (hIdx > 0) { hIdx--; input.value = history[hIdx]; }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (hIdx < history.length - 1) { hIdx++; input.value = history[hIdx]; } 
        else { hIdx = history.length; input.value = ''; }
      }
    });

    function toggleTheme() {
      const b = document.body;
      const isD = b.getAttribute('data-theme') === 'dark';
      b.setAttribute('data-theme', isD ? 'light' : 'dark');
      document.getElementById('t-icon').setAttribute('data-lucide', isD ? 'moon' : 'sun');
      lucide.createIcons();
    }

    function toggleModal() {
      const m = document.getElementById('modal');
      m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }

    function clearHist() {
      history = [];
      localStorage.removeItem('kb_h');
      toggleModal();
    }

    (async () => {
      lucide.createIcons();
      try {
        const r = await fetch(`${PROXY}?path=version`);
        const v = await r.text();
        const ver = v.trim();
        document.getElementById('v-label').textContent = ver;
        addEntry('version', `kebab-tools ${ver}`);
      } catch {
        addEntry('system', 'Connection failed.', true);
      }
    })();
  </script>
</body>
</html>
