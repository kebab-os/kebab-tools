- name: Count files recursively in functions/ excluding specific files
  run: |
    EXCLUDES="list.js index.js 404.js shell-proxy.js"

    FIND_CMD="find functions -type f"
    for FILE in $EXCLUDES; do
      FIND_CMD="$FIND_CMD ! -name $FILE"
    done

    COUNT=$(bash -c "$FIND_CMD" | wc -l)

    mkdir -p metrics
    cat <<EOF > metrics/tools.json
{
  "schemaVersion": 1,
  "label": "tools",
  "message": "$COUNT",
  "color": "blue"
}
EOF
