name: Count tools

on:
  push:
    paths:
      - "functions/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Count files recursively in functions/ excluding specific files
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "Current directory:"
          pwd

          echo "Listing all files under functions/:"
          find functions -type f || echo "functions/ not found"

          COUNT=$(find functions -type f \
            ! -name "list.js" \
            ! -name "index.js" \
            ! -name "404.js" \
            ! -name "shell-proxy.js" \
            | wc -l)

          echo "Final count: $COUNT"

          mkdir -p metrics
          cat <<EOF > metrics/tools.json
          {
            "schemaVersion": 1,
            "label": "tools",
            "message": "$COUNT",
            "color": "blue"
          }
          EOF

      - name: Commit updated count
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add metrics/tools.json
          git commit -m "Update tools count" || echo "No changes"
          git push
