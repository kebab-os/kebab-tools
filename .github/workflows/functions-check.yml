name: "Functions Compatibility"

on:
  pull_request:
    paths:
      - 'functions/**' # Only runs when you change your functions

jobs:
  check:
    name: "Functions Compatibility Check"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # Allows the "Success/Failure" to show in the PR box
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Run Compatibility Scan
        # This command validates routing and runtime compatibility
        run: npx wrangler pages functions build functions
